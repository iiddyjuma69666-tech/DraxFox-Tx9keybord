plugins { id 'com.android.application' }

android {
    namespace 'com.draxfox.tx9keyboard'
    compileSdk 35

    defaultConfig {
        applicationId 'com.draxfox.tx9keyboard'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '2.5.0'
    }

    signingConfigs {
        debug {
            storeFile file('tx9-debug.keystore')
            storePassword 'tx9draxfox'
            keyAlias 'tx9debugkey'
            keyPassword 'tx9draxfox'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}
